name: Build HERO MOTOCROSS 3D Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - hero-motocross-3d
    paths:
      - 'hero-motocross-3d/**'
      - '.github/workflows/build-hero-motocross.yml'

jobs:
  android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Install Java and Android export templates
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk unzip curl
          export ANDROID_HOME=/usr/lib/android-sdk
          export ANDROID_SDK_ROOT=/usr/lib/android-sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail -o /tmp/godot-templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/build_tools_version = "33.0.2"
          export/android/target_sdk_version = "33"
          EOF
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Export Android APK
        run: |
          mkdir -p artifacts
          godot --headless --path hero-motocross-3d --editor --quit
          godot --headless --path hero-motocross-3d --export-debug "Android" artifacts/HeroMotocross3D-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeroMotocross3D-Android-APK
          path: artifacts/HeroMotocross3D-debug.apk
          if-no-files-found: error
          retention-days: 14
