name: Build HERO MOTOCROSS 3D Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - hero-motocross-3d
    paths:
      - 'hero-motocross-3d/**'
      - '.github/workflows/build-hero-motocross.yml'

jobs:
  android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    env:
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: Install Java and Android export templates
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk unzip curl
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          echo "Installed Android SDK packages:"
          ls -la "$ANDROID_HOME/build-tools"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail -o /tmp/godot-templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          echo "Godot Android export settings:"
          cat "$HOME/.config/godot/editor_settings-4.tres"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Export Android APK
        run: |
          echo "SDK root: $ANDROID_SDK_ROOT"
          echo "Build tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"
          mkdir -p artifacts
          godot --headless --path hero-motocross-3d --editor --quit
          godot --headless --verbose --path hero-motocross-3d --export-debug "Android" artifacts/HeroMotocross3D-debug.apk
          test -s artifacts/HeroMotocross3D-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeroMotocross3D-Android-APK
          path: artifacts/HeroMotocross3D-debug.apk
          if-no-files-found: error
          retention-days: 14
