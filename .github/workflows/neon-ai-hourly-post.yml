name: Neon AI hourly posts

on:
  schedule:
    # Every hour at :45 UTC (:15 India Standard Time).
    - cron: "45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neon-ai-hourly-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install free video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Generate and publish alternating AI text/video post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_API_KEY: "AIzaSyAEMV_A0r-VrSaYXOfnqL0FkTgiltkgefE"
          NEON_AI_EMAIL: ${{ secrets.NEON_AI_EMAIL }}
          NEON_BOT_PASSWORD: ${{ secrets.NEON_BOT_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/neon-ai-hourly-post.mjs
